<style>
        /* Custom Styles for inputs to match Material/Refined Minimalism */
        .input-field {
            @apply w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all;

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-4 antialiased overflow-x-hidden">
<!-- Ambient Background Effect -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-30 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container rounded-full mix-blend-multiply filter blur-[120px] opacity-30 animate-blob animation-delay-2000"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[440px] z-10">
<!-- Brand Header (Simplified for transactional flow) -->
<div class="flex justify-center mb-10">
<h1 class="font-headline-xl text-headline-xl text-primary font-bold tracking-tight">SportIQ</h1>
</div>
<!-- Content Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/50 p-8 w-full glass-panel relative overflow-hidden">
<!-- Security Icon/Illustration -->
<div class="flex justify-center mb-6">
<div class="w-16 h-16 bg-primary-container/10 rounded-full flex items-center justify-center border border-primary-container/20">
<span class="material-symbols-outlined text-primary-container text-4xl" data-icon="lock_reset" style="font-variation-settings: 'FILL' 1, 'wght' 300;">lock_reset</span>
</div>
</div>
<!-- Headers & Text -->
<div class="text-center mb-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2 font-bold">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter your email and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant sr-only" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail" style="font-variation-settings: 'FILL' 0, 'wght' 300;">mail</span>
</div>
<input class="input-field pl-10" id="email" name="email" placeholder="Enter your email address" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-title-md text-title-md py-3 px-4 rounded-lg shadow-sm hover:shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Send Link
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 font-body-md text-body-md text-primary hover:text-primary-container transition-colors group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0, 'wght' 400;">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Subtle Footer -->
<div class="mt-8 text-center">
<p class="font-label-md text-label-md text-on-surface-variant/70">
                Securely managed by SportIQ Authentication
            </p>
</div>
</main>
<!-- Note: TopAppBar, BottomNavBar, and NavigationDrawer are intentionally suppressed 
         as this is a linear/transactional screen (Forgot Password) per the Semantic Shell Mandate. -->
