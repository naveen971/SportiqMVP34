<!DOCTYPE html>

                    "on-primary-fixed-variant": "#005234",

                    "headline-lg-mobile": ["Inter"],

                    "body-md": ["Inter"],
                    "title-md": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "stats-number": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.03em", "fontWeight": "700" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-[1120px] mx-auto pb-safe md:pb-0 h-screen overflow-hidden">
<!-- Hero Section -->
<section class="flex-1 relative overflow-hidden shrink-0 h-[45vh] md:h-[55vh] w-full">
<div class="absolute inset-0 w-full h-full bg-surface-container-high">

<!-- Gradient Overlay for smooth transition to content -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/40 to-transparent"></div>
</div>
</section>
<!-- Content Section -->
<section class="flex-1 flex flex-col items-center justify-center px-container-margin pt-lg pb-xl relative z-10 -mt-xl md:-mt-xl shrink-0 h-auto">
<div class="flex flex-col items-center max-w-sm w-full space-y-xl">
<!-- Logo & Tagline -->
<div class="flex flex-col items-center space-y-sm text-center">
<img alt="SportIQ Logo" class="w-24 h-24 object-contain mb-sm drop-shadow-sm rounded-xl bg-surface p-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUa4Z3rL-97NHfHaL4jD1PLi96IC1obZJgajDwrh6Gs14WwDzgWXQBa7R7HhNFMp0rwJSykded-IB870wUZPaoeEqbEKW3bdB0NLRI9evFnJY_pSE7yh9hVjBoQRS6j2_J79QC4ZGBYPIYB3WVGt3RIJ_w6pkKb6jg2w2OhSgKJ0tX5W-_3Zu5_7WNU412cY81ynFjXVNzMokS1rUyy8VBTMSAWPg6PfK3qDS0nUmUykO7OgYw19DustUDzK7P8HiewaJliBczwUQ"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">SportIQ</h1>
<p class="font-title-md text-title-md text-on-surface-variant tracking-tight">Prove Your Standard</p>
</div>
<!-- Actions -->
<div class="flex flex-col w-full space-y-md">
<button class="w-full h-11 bg-primary-container text-on-primary-container font-title-md text-title-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs">
                        Get Started
                    </button>
<button class="w-full h-11 bg-secondary text-on-secondary font-title-md text-title-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-xs">
                        Sign In
                    </button>
<button class="w-full h-11 bg-transparent text-secondary font-title-md text-title-md rounded-lg hover:bg-surface-container-low active:bg-surface-container transition-all flex items-center justify-center mt-sm">
                        Explore as Guest
                    </button>
</div>
</div>
</section>
</main>
</body></html>
