<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SportIQ - Verify Email</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "surface-container-low": "#f2f4f6",

                        "on-tertiary-fixed": "#181c20",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#004785",
                        "outline": "#6c7a70",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#005234",
                        "on-surface-variant": "#3c4a41",
                        "on-background": "#191c1e",
                        "tertiary-container": "#9ea1a6",
                        "on-secondary-fixed": "#001c3a",
                        "surface-bright": "#f8f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "secondary": "#005fae",
                        "primary": "#006c46",
                        "secondary-fixed-dim": "#a5c8ff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#34383c",
                        "outline-variant": "#bbcabf",
                        "tertiary-fixed-dim": "#c3c7cc",
                        "primary-fixed-dim": "#4cdf9d",
                        "on-secondary-container": "#003667",
                        "tertiary": "#5b5f63",

                        "background": "#f8f9fb",
                        "surface-dim": "#d8dadc",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002112",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "surface-tint": "#006c46",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e0e3e8",
                        "primary-container": "#00b87a",
                        "inverse-surface": "#2d3133",
                        "on-primary-container": "#004128",
                        "inverse-primary": "#4cdf9d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "xl": "32px",
                        "gutter": "12px",
                        "base": "8px",
                        "md": "16px",
                        "container-margin": "16px"
                    },
                    "fontFamily": {
                        "stats-number": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"],

                    },
                    "fontSize": {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(233, 236, 239, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        
        .pulse-ring {
            animation: pulse-ring-anim 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring-anim {
            0% { transform: scale(0.9); opacity: 0.8; }
            70% { transform: scale(1.4); opacity: 0; }
            100% { transform: scale(1.4); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-sans antialiased overflow-hidden">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none flex justify-center items-center">
<div class="absolute w-[800px] h-[800px] bg-primary/5 rounded-full blur-3xl transform -translate-y-1/4"></div>
<div class="absolute w-[600px] h-[600px] bg-secondary/5 rounded-full blur-3xl transform translate-x-1/3 translate-y-1/3"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-container-margin md:px-0">
<!-- Brand / Logo Area -->
<div class="flex justify-center mb-12">
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">SportIQ</h1>
</div>
<!-- Verification Card -->
<div class="glass-panel rounded-2xl p-xl flex flex-col items-center text-center">
<!-- Icon with Animation -->
<div class="relative flex items-center justify-center w-24 h-24 mb-lg">
<div class="absolute inset-0 bg-primary-container/10 rounded-full pulse-ring"></div>
<div class="absolute inset-2 bg-primary-container/20 rounded-full"></div>
<span class="material-symbols-outlined text-4xl text-primary relative z-10" style="font-variation-settings: 'FILL' 1;">
                    mail
                </span>
</div>
<!-- Typography -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">
                Check Your Email
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-sm">
                We've sent a verification link to <strong class="font-title-md text-title-md text-on-surface">player@sportiq.com</strong>. Please click it to continue.
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-lg font-title-md text-title-md flex items-center justify-center hover:bg-primary transition-colors duration-200 active:scale-[0.98]">
                    Open Email App
                </button>
<button class="w-full h-12 bg-transparent text-primary rounded-lg font-title-md text-title-md flex items-center justify-center hover:bg-surface-container-low transition-colors duration-200 active:scale-[0.98]">
                    Resend Link
                </button>
</div>
<!-- Contextual Return -->
<div class="mt-lg pt-lg border-t border-surface-variant w-full">
<button class="flex items-center justify-center gap-xs text-on-surface-variant hover:text-primary transition-colors duration-200 w-full font-label-md text-label-md uppercase">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Return to login
                </button>
</div>
</div>
</main>
</body></html>
